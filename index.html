<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Cartogram</title>
    <link rel="stylesheet" href="Farben.css">
</head>

<body>

    <div class="upload-bereich">
        <label for="csvUpload" style="font-family: sans-serif; font-size: 15px; font-weight: bold;">1. Map-Upload:</label><br>
        <input type="file" style="font-family: sans-serif; font-size: 8px; font-weight: bold;" id="csvUpload" accept=".csv">
    </div>

    <div class="upload-bereich">
        <label for="infoCsvUpload" style="font-family: sans-serif; font-size: 15px; font-weight: bold;">2. Info-Upload:</label><br>
        <input type="file" style="font-family: sans-serif; font-size: 8px; font-weight: bold;" id="infoCsvUpload" accept=".csv">
    </div>
    <br><br>

    <svg id="cartogram" xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 56 56">
        <g id="raster-container"></g>

        <rect id="reset-button" x="35" y="0" width="14" height="5" class="hintergrund-grau" rx="0.5" />
        <text x="41.8" y="3.2" font-family="sans-serif" font-size="2" fill="#333" text-anchor="middle" style="pointer-events:none; font-weight:bold;">Reset</text>

        <rect id="Legende" x="35" y="6" width="14" height="44" class="hintergrund-grau" rx="0.5" />
        <g id="legende-text-group"></g>
    </svg>

    <script src="config.js"></script>

    <script src="ClassInformation.js"></script>
    <script src="MapParser.js"></script>

    <script src="SvgTextWriter.js"></script>
    <script src="LegendStandard.js"></script>
    <script src="LegendUpdater.js"></script>

    <script src="FilterReset.js"></script>
    <script src="FilterApplier.js"></script>
    <script src="RasterInit.js"></script>
    <script src="RasterUpdater.js"></script>

    <script src="AppInit.js"></script>
    <script>
        // Startet die Anwendung, nachdem alle Klassen geladen wurden
        new AppInit().init();
    </script>
</body>

</html>
